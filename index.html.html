<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>커팅플랜 배치 툴 (멀티 판재 · 드래그앤드롭)</title>
<style>
  :root{--bg:#f4f6f8;--panel:#fff;--line:#d7dde3;--ink:#1f2933;--muted:#6b7885;--accent:#1f6e43;--bad:#e03131;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--panel);border-bottom:1px solid var(--line);padding:9px 16px;}
  h1{font-size:15px;margin:0 0 8px;}
  .ctrls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;}
  .fld{display:flex;flex-direction:column;gap:3px;}
  .fld label{font-size:11px;color:var(--muted);}
  .fld input,.fld select{width:92px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;font-size:13px;}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px;}
  .platebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center;}
  .pchip{display:flex;align-items:center;gap:7px;background:#eef4ef;border:1px solid #cfe0d6;border-radius:8px;padding:4px 6px 4px 10px;font-size:12px;}
  .pchip b{font-weight:700;}
  .pchip .x{cursor:pointer;border:none;background:#d9e6de;border-radius:5px;padding:1px 7px;font-size:12px;}
  .status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px;}
  .badge{padding:3px 9px;border-radius:12px;background:#eef4ef;font-weight:600;}
  .badge.warn{background:#fce6e6;color:var(--bad);}
  .wrap{display:flex;height:calc(100vh - 150px);}
  .tray{width:220px;min-width:220px;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;}
  .tray h2{font-size:12px;color:var(--muted);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .chip{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff;}
  .chip:hover{border-color:var(--accent);}
  .chip.placed{opacity:.4;}
  .chip .nm{font-size:13px;font-weight:600;}
  .chip small{color:var(--muted);font-size:11px;}
  .stage{flex:1;overflow:auto;background:repeating-linear-gradient(45deg,#eef1f4 0 10px,#f4f6f8 10px 20px);position:relative;}
  svg{display:block;}
  .selbar{position:sticky;bottom:12px;margin:0 auto;width:max-content;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:none;gap:8px;align-items:center;box-shadow:0 4px 14px #0002;}
  .selbar.show{display:flex;}
  polygon.sel{stroke:#111;stroke-width:6;}
  polygon.bad{stroke:var(--bad)!important;stroke-width:9;}
</style>
</head>
<body>
<header>
  <h1>커팅플랜 배치 툴 — 여러 판재를 추가하고, 조각을 드래그해서 올려놓으세요 (커팅여유보다 가까우면 빨강)</h1>
  <div class="ctrls">
    <div class="fld"><label>커팅방법</label>
      <select id="method">
        <option value="8">레이저(8)</option><option value="15">플라즈마(15)</option>
        <option value="20" selected>가스절단(20)</option><option value="10">워터젯(10)</option><option value="0">직접입력</option>
      </select></div>
    <div class="fld"><label>커팅여유(mm)</label><input id="gap" type="number" value="20"></div>
    <div class="sep"></div>
    <div class="fld"><label>판재 가로 L</label><input id="npL" type="number" value="9150"></div>
    <div class="fld"><label>판재 세로 W</label><input id="npW" type="number" value="2438"></div>
    <div class="fld"><label>두께 t</label><input id="npT" type="number" value="10" style="width:60px"></div>
    <div class="fld"><label>재질</label><select id="npMat"><option>A516-70</option><option>A283-C</option><option>A240-304</option><option>A36</option></select></div>
    <button class="primary" onclick="addPlate()">＋ 판재 추가</button>
    <div class="sep"></div>
    <button onclick="resetAll()">조각 초기화</button>
    <button onclick="autoPack()">자동 정렬(참고)</button>
    <button onclick="autoFillLeftover()">자투리 소형부품 자동배치</button>
  </div>
  <div class="platebar" id="platebar"></div>
  <div class="status">
    <span class="badge" id="stCount">배치 0/8</span>
    <span class="badge" id="stUtil">전체 활용률 0%</span>
    <span class="badge" id="stWarn">충돌 0</span>
    <span id="stMsg" style="color:var(--muted)"></span>
  </div>
</header>
<div class="wrap">
  <div class="tray">
    <h2>조각 목록</h2>
    <div id="chips"></div>
    <h2 style="margin-top:14px">사용법</h2>
    <div style="font-size:11px;color:var(--muted);line-height:1.7">
      · 트레이 조각 클릭 → 첫 판재에 올림<br>· 캔버스에서 드래그로 이동<br>· 다른 판재로도 끌어다 놓기<br>· 클릭 선택 → 회전<br>· <b style="color:var(--bad)">빨강</b> = 여유 미달/판재 밖<br>· 판재 밖 빈 곳 = 트레이(보관)
    </div>
  </div>
  <div class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="selbar" id="selbar">
      <b id="selName">—</b><span id="selSize" style="color:var(--muted);font-size:12px"></span>
      <button onclick="rotSel(-15)">⟲ -15°</button><button onclick="rotSel(15)">⟳ +15°</button>
      <button onclick="rotSel(90)">90°</button><button onclick="returnSel()">트레이로</button>
    </div>
  </div>
</div>
<script>
const SVG="http://www.w3.org/2000/svg";
function rectPts(w,h){return [[0,0],[w,0],[w,h],[0,h]];}
function sectorPts(Ri,Ro,a0,a1,n=26){let p=[];for(let i=0;i<=n;i++){let a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([Ro*Math.cos(a),Ro*Math.sin(a)]);}for(let i=n;i>=0;i--){let a=(a0+(a1-a0)*i/n)*Math.PI/180;p.push([Ri*Math.cos(a),Ri*Math.sin(a)]);}return p;}
function segPts(R,off,major,n=40){let ac=Math.acos(off/R),p=[];let a0=major?ac:-ac,a1=major?(2*Math.PI-ac):ac;for(let i=0;i<=n;i++){let a=a0+(a1-a0)*i/n;p.push([R*Math.cos(a),R*Math.sin(a)]);}return p;}
function circlePts(r,n=22){let p=[];for(let i=0;i<n;i++){let a=2*Math.PI*i/n;p.push([r*Math.cos(a),r*Math.sin(a)]);}return p;}
function norm(pts){let mx=Math.min(...pts.map(p=>p[0])),my=Math.min(...pts.map(p=>p[1]));return pts.map(p=>[p[0]-mx,p[1]-my]);}
function bbox(pts){let xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return {w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys),x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};}
function area(pts){let a=0;for(let i=0;i<pts.length;i++){let[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}
function xform(pts,x,y,rot){let r=rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return pts.map(p=>[x+p[0]*c-p[1]*s, y+p[0]*s+p[1]*c]);}
function dot(a,b){return a[0]*b[0]+a[1]*b[1];}function sub(a,b){return [a[0]-b[0],a[1]-b[1]];}
function segPtDist(p,a,b){let ab=sub(b,a),t=dot(sub(p,a),ab)/(dot(ab,ab)||1);t=Math.max(0,Math.min(1,t));let c=[a[0]+ab[0]*t,a[1]+ab[1]*t];return Math.hypot(p[0]-c[0],p[1]-c[1]);}
function ccw(A,B,C){return (C[1]-A[1])*(B[0]-A[0])>(B[1]-A[1])*(C[0]-A[0]);}
function segCross(A,B,C,D){return ccw(A,C,D)!=ccw(B,C,D)&&ccw(A,B,C)!=ccw(A,B,D);}
function segSegDist(A,B,C,D){if(segCross(A,B,C,D))return 0;return Math.min(segPtDist(A,C,D),segPtDist(B,C,D),segPtDist(C,A,B),segPtDist(D,A,B));}
function ptInPoly(pt,poly){let x=pt[0],y=pt[1],inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function polysOverlap(P,Q){for(let i=0;i<P.length;i++){let A=P[i],B=P[(i+1)%P.length];for(let j=0;j<Q.length;j++){if(segCross(A,B,Q[j],Q[(j+1)%Q.length]))return true;}}if(ptInPoly(P[0],Q)||ptInPoly(Q[0],P))return true;return false;}
function polyGap(P,Q){if(polysOverlap(P,Q))return 0;let m=1e9;for(let i=0;i<P.length;i++){let A=P[i],B=P[(i+1)%P.length];for(let j=0;j<Q.length;j++){m=Math.min(m,segSegDist(A,B,Q[j],Q[(j+1)%Q.length]));}}return m;}

const PIECES=[
 {id:'SA-01',name:'SHELL 상코스',color:'#6a8cbf',t:10,mat:'A516-70',base:norm(rectPts(8168,1700))},
 {id:'SA-02',name:'SHELL 하코스',color:'#6a8cbf',t:10,mat:'A516-70',base:norm(rectPts(8168,2400))},
 {id:'HA-대',name:'HEAD 대',color:'#e45756',t:10,mat:'A516-70',base:norm(segPts(1620,350,true))},
 {id:'HA-소',name:'HEAD 소',color:'#72b7b2',t:10,mat:'A516-70',base:norm(segPts(1620,350,false))},
 {id:'SB-04a',name:'CONE 상밴드',color:'#4C78A8',t:10,mat:'A516-70',base:norm(sectorPts(1219,2604,90,180))},
 {id:'SB-04b',name:'CONE 상밴드',color:'#4C78A8',t:10,mat:'A516-70',base:norm(sectorPts(1219,2604,0,90))},
 {id:'SB-05a',name:'CONE 중밴드',color:'#F58518',t:10,mat:'A516-70',base:norm(sectorPts(411,1219,90,180))},
 {id:'SB-05b',name:'CONE 중밴드',color:'#F58518',t:10,mat:'A516-70',base:norm(sectorPts(411,1219,0,90))},
 {id:'N-PAD1',name:'노즐패드',color:'#9DBE6A',t:10,mat:'A516-70',base:norm(circlePts(250))},
 {id:'N-PAD2',name:'노즐패드',color:'#9DBE6A',t:10,mat:'A516-70',base:norm(circlePts(250))},
 {id:'N-PAD3',name:'노즐패드',color:'#9DBE6A',t:10,mat:'A516-70',base:norm(circlePts(200))},
 {id:'N-PAD4',name:'노즐패드',color:'#9DBE6A',t:10,mat:'A516-70',base:norm(circlePts(200))},
 {id:'LEG-PAD1',name:'레그패드',color:'#B5A642',t:10,mat:'A516-70',base:norm(rectPts(700,1000))},
 {id:'LEG-PAD2',name:'레그패드',color:'#B5A642',t:10,mat:'A516-70',base:norm(rectPts(700,1000))},
 {id:'LUG-PAD1',name:'러그패드',color:'#B5A642',t:10,mat:'A516-70',base:norm(rectPts(300,400))},
 {id:'LUG-PAD2',name:'러그패드',color:'#B5A642',t:10,mat:'A516-70',base:norm(rectPts(300,400))},
 {id:'BASE-1',name:'베이스플레이트',color:'#8d99ae',t:25,mat:'A283-C',base:norm(rectPts(450,450))},
 {id:'BASE-2',name:'베이스플레이트',color:'#8d99ae',t:25,mat:'A283-C',base:norm(rectPts(450,450))},
 {id:'LIFT-1',name:'리프팅러그',color:'#8d99ae',t:25,mat:'A283-C',base:norm(rectPts(250,350))},
];
PIECES.forEach(p=>{p.x=0;p.y=0;p.rot=0;p.inTray=true;});
let plates=[{L:9150,W:2438,t:10,mat:'A516-70'},{L:10270,W:2000,t:10,mat:'A516-70'},{L:8870,W:3048,t:10,mat:'A516-70'}];
let gapMM=20, sel=null, PGAP=700;
const svg=document.getElementById('svg');

function plateY(i){let y=0;for(let k=0;k<i;k++)y+=plates[k].W+PGAP;return y;}
function trayY(){return plateY(plates.length-1)+ (plates.length?plates[plates.length-1].W:0) + PGAP;}
function worldPts(p){return xform(p.base,p.x,p.y,p.rot);}
function worldBB(p){return bbox(worldPts(p));}
function plateRect(i){let y=plateY(i);return {x0:0,y0:y,x1:plates[i].L,y1:y+plates[i].W};}
function rectOverlap(b,r){let ox=Math.max(0,Math.min(b.x1,r.x1)-Math.max(b.x0,r.x0)),oy=Math.max(0,Math.min(b.y1,r.y1)-Math.max(b.y0,r.y0));return ox*oy;}
function insideRect(bb,r){return bb.x0>=r.x0-1&&bb.x1<=r.x1+1&&bb.y0>=r.y0-1&&bb.y1<=r.y1+1;}
function locate(p){let bb=worldBB(p),best=-1,bo=0;plates.forEach((pl,i)=>{let ov=rectOverlap(bb,plateRect(i));if(ov>bo){bo=ov;best=i;}});if(best<0)return{plate:-1,inside:false};return{plate:best,inside:insideRect(bb,plateRect(best))};}

function validity(){
  let info={},bad=new Set();
  PIECES.forEach(p=>{let l=locate(p);p._plate=l.plate;p._inside=l.inside;});
  // out of bounds (overlapping a plate but not fully inside)
  PIECES.forEach(p=>{p._mismatch=false;if(p._plate>=0){let pl=plates[p._plate];if(!p._inside)bad.add(p.id);if(p.t!==pl.t||p.mat!==pl.mat){bad.add(p.id);p._mismatch=true;}}});
  // gap within same plate
  let onp={};PIECES.forEach(p=>{if(p._plate>=0){(onp[p._plate]=onp[p._plate]||[]).push(p);}});
  Object.values(onp).forEach(arr=>{let wp=arr.map(worldPts);for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++){if(polyGap(wp[i],wp[j])<gapMM){bad.add(arr[i].id);bad.add(arr[j].id);}}});
  return bad;
}
function layoutUnplaced(){let maxL=Math.max(...plates.map(pl=>pl.L),9000),x=100,y=trayY()+300,rowH=0;PIECES.forEach(p=>{let l=locate(p);if(l.plate>=0&&l.inside)return;let b=bbox(p.base);if(x+b.w>maxL){x=100;y+=rowH+300;rowH=0;}p.x=x;p.y=y;x+=b.w+300;rowH=Math.max(rowH,b.h);});}
function layoutAll(){let maxL=Math.max(...plates.map(pl=>pl.L),9000),x=100,y=trayY()+300,rowH=0;PIECES.forEach(p=>{p.rot=0;let b=bbox(p.base);if(x+b.w>maxL){x=100;y+=rowH+300;rowH=0;}p.x=x;p.y=y;x+=b.w+300;rowH=Math.max(rowH,b.h);});}

function render(){
  let bad=validity();
  let maxX=Math.max(...plates.map(p=>p.L),9000);PIECES.forEach(p=>{let b=worldBB(p);maxX=Math.max(maxX,b.x1);});
  let maxY=trayY();PIECES.forEach(p=>{let b=worldBB(p);maxY=Math.max(maxY,b.y1);});maxY+=400;
  svg.setAttribute('viewBox',`-120 -140 ${maxX+300} ${maxY+200}`);
  svg.setAttribute('width',Math.min((maxX+300)*0.125,2600));svg.setAttribute('height',(maxY+300)*0.125);
  svg.innerHTML='';
  plates.forEach((pl,i)=>{let r=plateRect(i);
    let rc=document.createElementNS(SVG,'rect');rc.setAttribute('x',0);rc.setAttribute('y',r.y0);rc.setAttribute('width',pl.L);rc.setAttribute('height',pl.W);rc.setAttribute('fill','#fff');rc.setAttribute('stroke','#111');rc.setAttribute('stroke-width',4);svg.appendChild(rc);
    let used=PIECES.filter(p=>p._plate===i&&p._inside).reduce((s,p)=>s+area(p.base),0);
    let t=document.createElementNS(SVG,'text');t.setAttribute('x',10);t.setAttribute('y',r.y0-35);t.setAttribute('font-size',120);t.setAttribute('fill','#555');t.textContent=`판재 ${i+1}: ${pl.L}×${pl.W} · t${pl.t} ${pl.mat} · 활용률 ${(used/(pl.L*pl.W)*100).toFixed(0)}%`;svg.appendChild(t);
  });
  let tl=document.createElementNS(SVG,'text');tl.setAttribute('x',10);tl.setAttribute('y',trayY()+180);tl.setAttribute('font-size',130);tl.setAttribute('fill','#6b7885');tl.textContent='▼ 조각 트레이 (드래그해서 판재 위로)';svg.appendChild(tl);
  PIECES.forEach(p=>{let wp=worldPts(p);
    let poly=document.createElementNS(SVG,'polygon');poly.setAttribute('points',wp.map(pt=>pt.join(',')).join(' '));poly.setAttribute('fill',p.color);poly.setAttribute('fill-opacity',.9);poly.setAttribute('stroke','#222');poly.setAttribute('stroke-width',3);poly.style.cursor='grab';
    if(sel===p)poly.classList.add('sel');if(bad.has(p.id))poly.classList.add('bad');
    poly.dataset.id=p.id;poly.addEventListener('pointerdown',startDrag);svg.appendChild(poly);
    let cx=wp.reduce((s,pt)=>s+pt[0],0)/wp.length,cy=wp.reduce((s,pt)=>s+pt[1],0)/wp.length;
    let t=document.createElementNS(SVG,'text');t.setAttribute('x',cx);t.setAttribute('y',cy);t.setAttribute('text-anchor','middle');t.setAttribute('font-size',95);t.setAttribute('fill','#fff');t.setAttribute('font-weight','700');t.setAttribute('pointer-events','none');t.textContent=p.id;svg.appendChild(t);
  });
  drawBars(bad);drawChips();
}
function drawBars(bad){
  let pb=document.getElementById('platebar');pb.innerHTML='<span style="font-size:12px;color:var(--muted)">판재:</span>';
  plates.forEach((pl,i)=>{let used=PIECES.filter(p=>p._plate===i&&p._inside).reduce((s,p)=>s+area(p.base),0);
    let d=document.createElement('span');d.className='pchip';d.innerHTML=`<b>${i+1}</b> ${pl.L}×${pl.W} · t${pl.t} · ${(used/(pl.L*pl.W)*100).toFixed(0)}% <button class="x" title="삭제">×</button>`;
    d.querySelector('.x').onclick=()=>delPlate(i);pb.appendChild(d);});
  let placed=PIECES.filter(p=>p._plate>=0&&p._inside).length;
  document.getElementById('stCount').textContent=`배치 ${placed}/${PIECES.length}`;
  let usedA=PIECES.filter(p=>p._plate>=0&&p._inside).reduce((s,p)=>s+area(p.base),0);
  let totA=plates.reduce((s,p)=>s+p.L*p.W,0);
  document.getElementById('stUtil').textContent=`전체 활용률 ${totA?(usedA/totA*100).toFixed(0):0}%`;
  let w=document.getElementById('stWarn');w.textContent=`충돌 ${bad.size}`;w.className='badge'+(bad.size?' warn':'');
  document.getElementById('stMsg').textContent=bad.size?'⚠ 빨강: 여유 미달 · 판재 밖 · 두께/재질 불일치':(placed===PIECES.length?'✅ 모든 조각 배치 완료':'');
}
function thumb(p){let b=bbox(p.base),s=30/Math.max(b.w,b.h),w=b.w*s,h=b.h*s;let pts=p.base.map(pt=>[(pt[0]-b.x0)*s+(34-w)/2,(pt[1]-b.y0)*s+(34-h)/2].join(',')).join(' ');return `<svg width=34 height=34 viewBox="0 0 34 34" style="flex:0 0 34px"><rect width="34" height="34" fill="#f4f6f8" rx="4"></rect><polygon points="${pts}" fill="${p.color}" stroke="#333" stroke-width="1"/></svg>`;}
function drawChips(){let c=document.getElementById('chips');c.innerHTML='';PIECES.forEach(p=>{let b=bbox(p.base);let placed=p._plate>=0&&p._inside&&!p._mismatch;
  let d=document.createElement('div');d.className='chip'+(placed?' placed':'');
  d.innerHTML=`${thumb(p)}<div><div class="nm">${p.id}</div><small>t${p.t} ${p.mat} · ${Math.round(b.w)}×${Math.round(b.h)}</small></div>`;
  d.onclick=()=>{if(!plates.length)return;let idx=plates.findIndex(pl=>pl.t===p.t&&pl.mat===p.mat);if(idx<0)idx=0;p.x=plates[idx].L/2-b.w/2;p.y=plateY(idx)+plates[idx].W/2-b.h/2;p.rot=0;sel=p;render();showSel();};
  c.appendChild(d);});}
let drag=null;
function svgPt(e){let ctm=svg.getScreenCTM().inverse(),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let r=pt.matrixTransform(ctm);return[r.x,r.y];}
function startDrag(e){let p=PIECES.find(x=>x.id===e.target.dataset.id);sel=p;let m=svgPt(e);drag={p,dx:m[0]-p.x,dy:m[1]-p.y};e.target.setPointerCapture(e.pointerId);showSel();render();}
svg.addEventListener('pointermove',e=>{if(!drag)return;let m=svgPt(e);drag.p.x=m[0]-drag.dx;drag.p.y=m[1]-drag.dy;render();});
svg.addEventListener('pointerup',()=>{drag=null;render();});
function showSel(){let sb=document.getElementById('selbar');if(!sel){sb.classList.remove('show');return;}let b=bbox(xform(sel.base,0,0,sel.rot));sb.classList.add('show');document.getElementById('selName').textContent=sel.id;document.getElementById('selSize').textContent=`${sel.name} · ${Math.round(b.w)}×${Math.round(b.h)} · ${sel.rot}°`;}
function rotSel(d){if(!sel)return;sel.rot=(sel.rot+d+360)%360;render();showSel();}
function returnSel(){if(!sel)return;sel.x=-1e6;sel.rot=0;layoutUnplaced();sel=null;render();showSel();}
function addPlate(){let L=+document.getElementById('npL').value||3000,W=+document.getElementById('npW').value||2000,t=+document.getElementById('npT').value||10,mat=document.getElementById('npMat').value;plates.push({L,W,t,mat});render();}
function delPlate(i){plates.splice(i,1);layoutUnplaced();render();}
function resetAll(){layoutAll();sel=null;render();showSel();}
function autoFillLeftover(){
  plates.forEach((pl,pi)=>{let y0=plateY(pi);
    let placed=PIECES.filter(p=>{let l=locate(p);return l.plate===pi&&l.inside&&p.t===pl.t&&p.mat===pl.mat;});
    let cand=PIECES.filter(p=>{let l=locate(p);return (l.plate<0||!l.inside)&&p.t===pl.t&&p.mat===pl.mat;}).sort((a,b)=>area(a.base)-area(b.base));
    let step=Math.max(70,Math.min(pl.L,pl.W)/45);
    cand.forEach(p=>{let b=bbox(p.base),found=false;
      for(let y=y0+gapMM;y+b.h<=y0+pl.W-gapMM&&!found;y+=step){
        for(let x=gapMM;x+b.w<=pl.L-gapMM&&!found;x+=step){
          let wp=xform(p.base,x,y,0);let ok=true;
          for(let q of placed){if(polyGap(wp,worldPts(q))<gapMM){ok=false;break;}}
          if(ok){p.x=x;p.y=y;p.rot=0;placed.push(p);found=true;}}}
    });
  });
  render();
}
function autoPack(){layoutAll();
  let cur=plates.map((pl,i)=>({x:gapMM+10,y:plateY(i)+gapMM+10,rowH:0}));
  PIECES.slice().sort((a,b)=>bbox(b.base).h-bbox(a.base).h).forEach(p=>{let b=bbox(p.base),done=false;
    for(let i=0;i<plates.length&&!done;i++){let pl=plates[i],c=cur[i];
      if(pl.t!==p.t||pl.mat!==p.mat)continue;
      if(b.w>pl.L-2*gapMM||b.h>pl.W-2*gapMM)continue;
      if(c.x+b.w>pl.L-gapMM){c.x=gapMM+10;c.y+=c.rowH+gapMM+10;c.rowH=0;}
      if(c.y+b.h>plateY(i)+pl.W-gapMM)continue;
      p.x=c.x;p.y=c.y;p.rot=0;c.x+=b.w+gapMM+10;c.rowH=Math.max(c.rowH,b.h);done=true;}});
  render();}
document.getElementById('method').addEventListener('change',e=>{if(e.target.value!=='0'){document.getElementById('gap').value=e.target.value;gapMM=+e.target.value;render();}});
document.getElementById('gap').addEventListener('input',e=>{gapMM=+e.target.value||0;document.getElementById('method').value='0';render();});
layoutAll();render();
</script>
</body>
