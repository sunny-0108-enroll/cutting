<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커팅플랜 배치툴</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2733; --muted:#6b7684;
  --line:#dfe3e8; --accent:#2f6fde; --accent2:#1b4fa8; --bad:#e23b3b;
  --good:#2fa36b; --tray:#fbfcfd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Noto Sans KR','Noto Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
header.app{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:7px}
.title{display:flex;align-items:center;gap:10px}
.title b{font-size:15px}
.title .tag{font-size:11px;color:var(--muted);background:#eef2f8;border:1px solid var(--line);border-radius:10px;padding:2px 8px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px}
.ctrls .grp{display:flex;align-items:center;gap:4px;background:var(--tray);border:1px solid var(--line);border-radius:7px;padding:3px 7px}
.ctrls label{color:var(--muted)}
.ctrls input,.ctrls select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:#fff}
.ctrls input[type=number]{width:62px}
button{font:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;color:var(--ink)}
button:hover{background:#f0f4fb}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.pri:hover{background:var(--accent2)}
button.warn{color:var(--bad);border-color:#f0c2c2}
.main{flex:1;display:flex;min-height:0}
.tray{width:238px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tray .ph{padding:9px 11px;border-bottom:1px solid var(--line)}
.tray h2{margin:0 0 6px;font-size:13px}
.tray .psel{width:100%;font:inherit;font-size:12px;padding:5px;border:1px solid var(--line);border-radius:6px;background:#fff}
.tray .pmeta{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.crit{margin-top:7px;font-size:11px;color:var(--ink)}
.crit summary{cursor:pointer;color:var(--accent);font-weight:600}
.crit ol{padding-left:16px;margin:5px 0 0;line-height:1.45;max-height:220px;overflow:auto}
.crit li{margin-bottom:4px;color:#3a4552}
.badge{display:inline-block;font-size:9.5px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:4px;color:#fff}
.bA{background:#2fa36b}.bB{background:#d9a400}.bC{background:#e23b3b}
.cmp{padding:14px 18px;font-size:12px;background:#fff;min-height:100%}
.cmp h3{margin:0 0 8px;font-size:14px}
.cmp .sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cmp .card{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:170px;background:var(--tray)}
.cmp .card b{font-size:15px}
.cmp table{border-collapse:collapse;width:100%;max-width:1150px}
.cmp th,.cmp td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.cmp th{background:#eef2f8;font-weight:600}
.cmp td.num{text-align:right}
.cmp tr.ok td.v{color:#2fa36b;font-weight:600}
.cmp tr.near td.v{color:#d9a400;font-weight:600}
.cmp tr.diff td.v,.cmp tr.miss td.v,.cmp tr.add td.v{color:#e23b3b;font-weight:600}
.cmp h4{margin:16px 0 6px;font-size:13px;border-left:3px solid var(--accent);padding-left:8px}
.cmp ul{margin:4px 0 0;padding-left:18px;line-height:1.55;max-width:1100px}
.cmp li{margin-bottom:5px}
.cmp td.good{color:#2fa36b;font-weight:600}.cmp td.warn{color:#b98600;font-weight:600}.cmp td.bad{color:#e23b3b;font-weight:600}
.cmp .k{color:var(--muted);font-size:11px}
.cmp .note{color:var(--muted);font-size:11px;margin-top:8px}
.trayhd{padding:7px 11px 3px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
#chips{flex:1;overflow-y:auto;padding:4px 8px 12px}
.chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;margin-bottom:5px;background:var(--tray);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--accent);background:#f3f7ff}
.chip.placed{opacity:.42}
.chip .sw{width:34px;height:34px;flex:none;background:#fff;border:1px solid var(--line);border-radius:5px}
.chip .info{min-width:0;line-height:1.35}
.chip .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .sub{font-size:10.5px;color:var(--muted)}
.stagewrap{flex:1;display:flex;flex-direction:column;min-width:0}
.platebar{background:var(--panel);border-bottom:1px solid var(--line);padding:5px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11.5px;min-height:34px}
.pbadge{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:2px 4px 2px 9px;background:var(--tray)}
.pbadge .x{cursor:pointer;color:var(--muted);border:none;background:none;font-size:13px;padding:0 4px}
.pbadge .x:hover{color:var(--bad)}
.stage{flex:1;overflow:auto;background:#eceff3;position:relative}
#svg{display:block}
.status{background:var(--panel);border-top:1px solid var(--line);padding:5px 12px;display:flex;gap:18px;font-size:12px;align-items:center;flex-wrap:wrap}
.status .k{color:var(--muted)}
.status .warnmsg{color:var(--bad)}
.hint{font-size:11px;color:var(--muted)}
.selpanel{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);display:none;min-width:150px}
.selpanel.on{display:block}
.selpanel .row{display:flex;gap:6px;margin-top:6px}
.selpanel b{font-size:12px}
</style>
</head>
<body>
<header class="app">
  <div class="title">
    <b>커팅플랜 배치툴</b>
    <span class="tag">도면 CP 추출 → 네스팅 (HITL)</span>
    <span class="hint">조각 클릭=판재에 올리기 · 드래그=이동 · 클릭 후 R=15° 회전 · Shift+R=90°</span>
  </div>
  <div class="ctrls">
    <div class="grp">
      <label>커팅방법</label>
      <select id="method">
        <option value="8">레이저 (8mm)</option>
        <option value="15" selected>플라즈마 (15mm)</option>
        <option value="20">가스 (20mm)</option>
        <option value="10">워터젯 (10mm)</option>
      </select>
      <label>여유</label><input type="number" id="gap" value="15" min="0" step="1"><span class="k">mm</span>
    </div>
    <div class="grp">
      <label>판재추가 가로</label><input type="number" id="npL" value="6000">
      <label>세로</label><input type="number" id="npW" value="2000">
      <label>두께</label><input type="number" id="npT" value="10" step="1">
      <label>재질</label><input type="text" id="npMat" value="A516-70" style="width:90px">
      <button id="addPlate" class="pri">＋판재</button>
    </div>
    <div class="grp">
      <label>운반 max 가로</label><input type="number" id="maxL" value="12000">
      <label>세로</label><input type="number" id="maxW" value="3000">
    </div>
    <button id="autoArr">자동정렬</button>
    <button id="autoFill">자투리 자동배치</button>
    <button id="autoNest">⚙ 자동네스팅(주문판재)</button>
    <button id="reset" class="warn">배치 초기화</button>
    <div class="grp"><label>확대</label><input type="range" id="zoom" min="0.4" max="2.4" step="0.05" value="1"></div>
  </div>
</header>
<div class="main">
  <aside class="tray">
    <div class="ph">
      <h2>프로젝트</h2>
      <select id="projSel" class="psel"></select>
      <div class="pmeta" id="projMeta"></div>
      <details id="critBox" class="crit" style="display:none"><summary>판단 기준 (도면→전개 규칙)</summary><ol id="critList"></ol></details>
    </div>
    <div class="trayhd"><span>추출된 조각 (CP)</span><span id="trayCount"></span></div>
    <div id="chips"></div>
  </aside>
  <div class="stagewrap">
    <div class="platebar" id="platebar"></div>
    <div class="stage" id="stage">
      <svg id="svg"></svg>
      <div id="cmpPanel" class="cmp" style="display:none"></div>
      <div class="selpanel" id="selpanel">
        <b id="selName">-</b>
        <div class="k" id="selSpec"></div>
        <div class="row">
          <button id="rot15">↻ 15°</button>
          <button id="rot90">↻ 90°</button>
          <button id="ret">트레이로</button>
        </div>
      </div>
    </div>
    <div class="status">
      <span><span class="k">배치</span> <b id="stCount">0/0</b></span>
      <span><span class="k">판재 사용률</span> <b id="stUtil">-</b></span>
      <span><span class="k">총 중량(배치분)</span> <b id="stWt">-</b></span>
      <span class="warnmsg" id="stWarn"></span>
      <span class="k" id="stMsg"></span>
    </div>
  </div>
</div>
<script>
const PROJECTS = {"SUMMARY":{"label":"분석 요약 (전체)","plates":[],"pieces":[],"summary":"\n<h3>분석 요약 — 도면 → 전개조각 → 커팅플랜 자동화 검증 (202610 / D-1203 · S-2120)</h3>\n<div class=\"sum\">\n <div class=\"card\">파이프라인<br><b>DWG→DXF→조각추출</b><br><span class=\"k\">정답지(CP) 역추출 + 도면추론 + 비교</span></div>\n <div class=\"card\">S-2120 (Duplex 분리기)<br><b>15/22</b> 항목 일치·근사<br><span class=\"k\">판재 9장 2.03t (CP 8장 2.05t)</span></div>\n <div class=\"card\">D-1203 (석션 세퍼레이터)<br><b>17/26</b> 항목 일치·근사<br><span class=\"k\">판재 17장 22.3t (CP 판재 미정의)</span></div>\n</div>\n\n<h4>1. 입력 데이터 품질 — 같은 '도면'이라도 자동화 난이도가 전혀 다르다</h4>\n<table>\n<tr><th>항목</th><th>S-2120</th><th>D-1203</th></tr>\n<tr><td>DWG 변환</td><td class=\"good\">AC1021, libredwg 정상 변환</td><td class=\"bad\">AC1021 변형, libredwg 변환 실패 (ODA/AutoCAD 필요)</td></tr>\n<tr><td>PDF 텍스트</td><td class=\"good\">텍스트 레이어 있음</td><td class=\"bad\">문자까지 아웃라인 처리 → 텍스트 추출 0건 → OCR/VLM 필수</td></tr>\n<tr><td>치수 신뢰성</td><td class=\"warn\">디테일별 dimlfac 1 / 0.667 / 3 혼재 → 보정 필요, 치수문자 override 우선</td><td class=\"warn\">비전 판독(이미지) — 숫자 오독 위험, 블록 내 치수 다수</td></tr>\n<tr><td>CP 정답지 형태</td><td>판재 위 네스팅 배치도 (판재 8장 정의)</td><td>전개도 나열 도면 (판재 미정의, 좌측에 콘 전개 참고도)</td></tr>\n<tr><td>BOM ↔ 도면 정합</td><td class=\"good\">정합</td><td class=\"warn\">콘 분할수 불일치 (심계획 6 / BOM 3 / CP 4), CP 두께가 BOM과 다른 항목 3건</td></tr>\n</table>\n\n<h4>2. 도면추론 결과 — 대형 부재는 맞고, 틀린 곳은 전부 '규칙 파라미터'와 '소형 부속'</h4>\n<table>\n<tr><th>부재군</th><th>S-2120</th><th>D-1203</th><th>판독 근거</th></tr>\n<tr><td>SHELL 전개</td><td class=\"good\">4738×1823 일치</td><td class=\"good\">11702×2662 일치</td><td>π×(ID+t) × seam plan 길이 — A등급</td></tr>\n<tr><td>HEAD 블랭크</td><td class=\"good\">TOP 일치 / BTM 10mm 차</td><td class=\"warn\">Ø4504 vs CP Ø4590 (−2%)</td><td>등가면적 + 트리밍 35 — 두꺼운 판일수록 현장 여유 ↑ (룰 파라미터화 필요)</td></tr>\n<tr><td>CONE 전개</td><td>-</td><td class=\"good\">상단밴드 5264×2560 vs 5233×2553</td><td>전개각 360°·sinα, 밴드/심 수는 seam plan — 하부 분할수는 HITL</td></tr>\n<tr><td>NOZZLE NECK</td><td class=\"good\">A·M 일치, B 5mm</td><td class=\"warn\">N1 일치, N11·M1 −40mm</td><td>폭 π(OD−t) 정확. 길이 여유: t8 소구경 +25, t20 대구경 +65 패턴</td></tr>\n<tr><td>REINF. PAD</td><td class=\"good\">4종 일치</td><td class=\"good\">M1·N11 일치, K6·V1은 CP 미포함</td><td>노즐리스트 Ø×t 그대로 — A등급</td></tr>\n<tr><td>RING 세그먼트</td><td class=\"good\">20개 수량·각도 일치</td><td class=\"good\">스티프너 6분할 일치</td><td>DXF ARC 각도에서 직접 판독</td></tr>\n<tr><td>지지물/러그</td><td class=\"warn\">BASE↔CONN 300/310 뒤바뀜</td><td class=\"warn\">거셋 높이·러그 테이퍼 포락 차</td><td>C등급 플래그 = HITL이 확인해야 할 곳을 정확히 가리킴</td></tr>\n<tr><td>소형 부속</td><td class=\"bad\">END PL·SUPT PL·러그패드 누락 / 클립·커버 추가</td><td class=\"bad\">K6·V1 패드·어스러그 추가</td><td>하위 BOM(003~005) 해석 범위 결정 필요</td></tr>\n</table>\n\n<h4>3. 판재(주문) 산정</h4>\n<ul>\n<li><b>S-2120</b>: 추론 9장 2,034kg vs CP 8장 2,053kg — 중량 −1%, 장수 +1. 큰 조각/작은 조각 분리 규칙이 CP의 수작업 배치와 거의 같은 판 구성을 냄.</li>\n<li><b>D-1203</b>: 추론 17장 22.3t. 경판 대편 높이 3224 때문에 운반 max 폭을 3300으로 가정. 2~3조각짜리 소형 판(t32·t16 등)은 실무에선 잔재 활용 대상 → \"최소 주문 단위\" 규칙 추가 필요.</li>\n<li>공통: 두께+재질 동일 그룹만 같은 판재, 폭 50 올림, 운반 max 12000×W, 최소폭 400 — 모두 설정값.</li>\n</ul>\n\n<h4>4. 결론 — 연구과제(RQ)에 주는 시사점</h4>\n<ul>\n<li><b>RQ1 (도면 판독)</b>: DXF가 깨끗하면 쉘·경판·콘·노즐·패드·링 등 중량의 90% 이상을 차지하는 부재는 규칙만으로 자동 전개 가능. 병목은 (a) DWG 호환성·PDF 아웃라인 등 <u>입력 포맷</u>, (b) 블록 내부 치수·디테일별 축척 등 <u>작도 관행</u>. 표준화 요구사항은 '그리는 법'보다 '내보내는 법'(텍스트 보존 PDF, 표준 DWG 저장, 치수문자 명시)에 집중하는 편이 외부 설계사 부담이 적음.</li>\n<li><b>RQ2 (HITL 위치)</b>: C등급 플래그가 실제 오차 지점(BASE/CONN 치수, 콘 분할수, 거셋 높이)과 일치 → HITL은 <u>전체 검토가 아니라 C등급 항목 + 룰 파라미터(블랭크 여유·넥 여유) 승인</u>으로 좁힐 수 있음.</li>\n<li><b>RQ3 (표준화 ROI)</b>: 두 프로젝트의 차이가 보여주듯, 표준화 없이도 S-2120 수준 입력이면 자동화율이 높고, D-1203 수준이면 OCR/VLM 비용이 추가됨 → 표준화 ROI는 '입력 품질 등급별'로 산정하는 게 맞음.</li>\n<li><b>부수 발견</b>: D-1203 CP의 두께가 도면 BOM과 다른 항목(N11 넥 t20→15, 거셋 t22→20, N11 내부넥 t8→6) — 리비전/구매사양 확인 필요.</li>\n</ul>\n<div class=\"note\">※ 판정 기준: 포락(bbox) 면적 차 3% 미만 '일치', 10% 미만 '근사'. CP 추출 자체도 자동이라 LINE으로만 그려진 조각은 CP 쪽에서 누락될 수 있음. 도면추론은 CP를 전혀 참조하지 않고 수행 후 사후 비교.</div>\n"},"D-1203":{"label":"D-1203 · CP 정답지 추출","plates":[],"pieces":[{"id":"SHEL-01","nam const DENS = 7.85e-6; // kg/mm^3 steel
function bbox(pts){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of pts){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y;}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0};}
function area(pts){let a=0;for(let i=0,n=pts.length;i<n;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%n];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}
function rotPts(pts,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return pts.map(([x,y])=>[x*c-y*s,x*s+y*c]);}
function normMin(pts){const b=bbox(pts);return pts.map(([x,y])=>[x-b.x0,y-b.y0]);}
function rotNorm(base,deg){return deg?normMin(rotPts(base,deg)):base.map(p=>[p[0],p[1]]);}
function translate(pts,dx,dy){return pts.map(([x,y])=>[x+dx,y+dy]);}
function ptInPoly(px,py,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>py)!=(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;}return inside;}
function segSegDist(p1,p2,p3,p4){
  function d2(a,b){const dx=a[0]-b[0],dy=a[1]-b[1];return dx*dx+dy*dy;}
  function ptSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const l2=dx*dx+dy*dy;if(l2===0)return d2(p,a);let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2;t=Math.max(0,Math.min(1,t));return d2(p,[a[0]+t*dx,a[1]+t*dy]);}
  function ccw(a,b,c){return(c[1]-a[1])*(b[0]-a[0])>(b[1]-a[1])*(c[0]-a[0]);}
  if(ccw(p1,p3,p4)!=ccw(p2,p3,p4)&&ccw(p1,p2,p3)!=ccw(p1,p2,p4))return 0;
  return Math.sqrt(Math.min(ptSeg(p1,p3,p4),ptSeg(p2,p3,p4),ptSeg(p3,p1,p2),ptSeg(p4,p1,p2)));
}
function polyMinGap(A,B){ // min distance between two polygons (0 if overlap)
  // quick overlap: any vertex of one inside other
  for(const p of A)if(ptInPoly(p[0],p[1],B))return 0;
  for(const p of B)if(ptInPoly(p[0],p[1],A))return 0;
  let m=1e9;
  for(let i=0;i<A.length;i++){const a1=A[i],a2=A[(i+1)%A.length];for(let j=0;j<B.length;j++){const b1=B[j],b2=B[(j+1)%B.length];const d=segSegDist(a1,a2,b1,b2);if(d<m)m=d;if(m===0)return 0;}}
  return m;
}

/* ---------- state ---------- */
let PIECES=[];            // working piece instances
let plates=[];            // [{L,W,t,mat}]
let gapMM=15, sel=null;
let projKey=null;
const PGAP_MM=350;        // visual gap between plate rows (world mm)
const BASE_PXPMM=0.085;   // base px per mm
let zoom=1;
const svg=document.getElementById('svg');
const stage=document.getElementById('stage');

/* ---------- project loading ---------- */
function loadProject(key){
  projKey=key;
  const proj=PROJECTS[key];
  PIECES=proj.pieces.map((t,i)=>({
    uid:key+'_'+i, id:t.id, name:t.name, color:t.color, t:t.t, mat:t.mat,
    base:t.base, x:0,y:0,rot:0,inTray:true,pi:-1, conf:t.conf||'', src:t.src||'', note:t.note||''
  }));
  // load answer-key plates if present, else leave current
  plates = proj.plates.length ? proj.plates.map(p=>({L:p.L,W:p.W,t:p.t,mat:p.mat}))
                              : [];
  if(proj.layout){proj.layout.forEach((L,i)=>{if(L&&PIECES[i]&&L.pi<plates.length){const p=PIECES[i];p.inTray=false;p.pi=L.pi;p.x=L.x;p.y=L.y;p.rot=L.rot;}});}
  sel=null;
  const b = PROJECTS[key];
  const mats=[...new Set(b.pieces.map(p=>p.mat))];
  const ths=[...new Set(b.pieces.map(p=>p.t))].sort((a,c)=>a-c);
  document.getElementById('projMeta').innerHTML=
    `조각 <b>${b.pieces.length}</b>개 · 재질 ${mats.length}종<br>두께(mm): ${ths.join(', ')}`
    + (b.plates.length?(b.derived?`<br>추론 판재 <b>${b.plates.length}</b>장 자동 로드됨`:`<br>정답지 판재 <b>${b.plates.length}</b>장 자동 로드됨`):'')
    + (b.derived?`<br><span style="color:#2fa36b">A</span> 도면치수 · <span style="color:#d9a400">B</span> 규칙적용 · <span style="color:#e23b3b">C</span> 가정(HITL)`:'');
  const cb=document.getElementById('critBox');
  if(b.criteria&&b.criteria.length){cb.style.display='block';document.getElementById('critList').innerHTML=b.criteria.map(c=>`<li>${c}</li>`).join('');}else cb.style.display='none';
  const cp=document.getElementById('cmpPanel');
  if(b.summary){cp.style.display='block';svg.style.display='none';cp.innerHTML=b.summary;document.getElementById('projMeta').innerHTML='두 프로젝트 정답지 추출·도면추론·비교 결과의 종합 요약';}
  else if(b.compare){cp.style.display='block';svg.style.display='none';cp.innerHTML=renderCompare(key,b.compare);
    document.getElementById('projMeta').innerHTML=`정답지(CP 추출) ${b.compare.cp.pieces}조각 vs 도면추론 ${b.compare.ai.pieces}조각<br>일치/근사/차이는 포락 치수(bbox) 기준`;}
  else{cp.style.display='none';svg.style.display='block';}
  render();
}

/* ---------- compare panel ---------- */
function renderCompare(key,c){
  const cnt={ok:0,near:0,diff:0,miss:0,add:0};c.rows.forEach(r=>cnt[r.cls]++);
  const kg=v=>v==null?'-':(v>=1000?(v/1000).toFixed(2)+' t':v+' kg');
  let h=`<h3>${key.replace('-CMP','')} — 정답지(CP) vs 도면추론 비교</h3><div class="sum">`;
  h+=`<div class="card">정답지 CP<br><b>${c.cp.pieces}</b> 조각 · 판재 ${c.cp.plates||'-'}장 · ${kg(c.cp.kg)}</div>`;
  h+=`<div class="card">도면추론<br><b>${c.ai.pieces}</b> 조각 · 판재 ${c.ai.plates}장 · ${kg(c.ai.kg)}</div>`;
  h+=`<div class="card">판정<br><span style="color:#2fa36b"><b>${cnt.ok}</b> 일치</span> · <span style="color:#d9a400"><b>${cnt.near}</b> 근사</span> · <span style="color:#e23b3b"><b>${cnt.diff}</b> 차이 · <b>${cnt.miss}</b> 누락 · <b>${cnt.add}</b> 추가</span></div></div>`;
  h+=`<table><tr><th>부품</th><th>CP 수량</th><th>CP 치수(포락)</th><th>CP t</th><th>추론 수량</th><th>추론 치수(포락)</th><th>추론 t</th><th>판정</th></tr>`;
  for(const r of c.rows){h+=`<tr class="${r.cls}"><td>${r.name}</td><td class="num">${r.cp_qty}</td><td>${r.cp_size}</td><td>${r.cp_t}</td><td class="num">${r.ai_qty}</td><td>${r.ai_size}</td><td>${r.ai_t}</td><td class="v">${r.verdict}</td></tr>`;}
  h+=`</table>`;
  if(c.note)h+=`<div class="note">※ ${c.note}</div>`;
  h+=`<div class="note">※ 일치: 포락면적 차 3% 미만 · 근사: 10% 미만 · 차이: 10% 이상 또는 수량 불일치. CP 쪽 '누락'에는 CP 도면에서 LINE으로만 그려져 자동추출이 안 된 조각도 포함될 수 있음.</div>`;
  return h;
}
/* ---------- world layout ---------- */
function plateRects(){ // returns [{x,y,L,W,...plate}] in world mm, stacked vertically
  let y=0,out=[];
  for(const p of plates){out.push({x:0,y,L:p.L,W:p.W,t:p.t,mat:p.mat,ref:p});y+=p.W+PGAP_MM;}
  return out;
}
function worldSize(){const rs=plateRects();let W=1000,H=1000;for(const r of rs){W=Math.max(W,r.L);H=Math.max(H,r.y+r.W);}return{W,H};}

/* ---------- piece world polygon ---------- */
function pieceLocalPoly(p){return rotNorm(p.base,p.rot);} // normalized at 0,0
function pieceWorldPoly(p,rects){
  if(p.inTray||p.pi<0||p.pi>=rects.length)return null;
  const r=rects[p.pi];const loc=pieceLocalPoly(p);
  return translate(loc,r.x+p.x,r.y+p.y);
}

/* ---------- validation ---------- */
function validate(rects){
  const bad=new Set();
  // group placed by plate
  const byPlate={};
  for(const p of PIECES){if(p.inTray||p.pi<0)continue;(byPlate[p.pi]=byPlate[p.pi]||[]).push(p);}
  for(const pi in byPlate){
    const r=rects[pi];if(!r)continue;
    const polys=byPlate[pi].map(p=>({p,poly:pieceWorldPoly(p,rects)}));
    // bounds + thickness mismatch
    for(const it of polys){
      const b=bbox(it.poly);
      if(b.x0<r.x-0.5||b.y0<r.y-0.5||b.x1>r.x+r.L+0.5||b.y1>r.y+r.W+0.5)bad.add(it.p.uid);
      if(r.ref.t && Math.abs(it.p.t-r.ref.t)>0.01)bad.add(it.p.uid); // wrong thickness plate
      if(r.ref.mat && it.p.mat && r.ref.mat!==it.p.mat)bad.add(it.p.uid); // wrong material plate
    }
    // pairwise gap
    for(let i=0;i<polys.length;i++)for(let j=i+1;j<polys.length;j++){
      const g=polyMinGap(polys[i].poly,polys[j].poly);
      if(g<gapMM-0.5){bad.add(polys[i].p.uid);bad.add(polys[j].p.uid);}
    }
  }
  return bad;
}

/* ---------- render ---------- */
function render(){
  const rects=plateRects();const ws=worldSize();
  const S=BASE_PXPMM*zoom;
  const padpx=18;
  const Wpx=ws.W*S+padpx*2, Hpx=ws.H*S+padpx*2;
  svg.setAttribute('width',Math.max(Wpx,stage.clientWidth-4));
  svg.setAttribute('height',Math.max(Hpx,stage.clientHeight-4));
  svg.setAttribute('viewBox',`${-padpx} ${-padpx} ${Math.max(Wpx,stage.clientWidth-4)} ${Math.max(Hpx,stage.clientHeight-4)}`);
  const bad=validate(rects);
  let h='';
  // plates
  rects.forEach((r,i)=>{
    const x=r.x*S,y=r.y*S,w=r.L*S,ht=r.W*S;
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${ht}" fill="#ffffff" stroke="#9aa6b2" stroke-width="1.2" rx="2"/>`;
    h+=`<rect x="${x}" y="${y}" width="${w}" height="${ht}" fill="none" stroke="#c7d0da" stroke-dasharray="3 4" stroke-width="0.6"/>`;
    h+=`<text x="${x+2}" y="${y-4}" font-size="11.5" fill="#55606c" font-weight="600">판재 ${i+1}  ${r.L}×${r.W}  t${r.ref.t||'-'}  ${r.ref.mat||''}</text>`;
  });
  // pieces
  for(const p of PIECES){
    if(p.inTray||p.pi<0)continue;
    const poly=pieceWorldPoly(p,rects);if(!poly)continue;
    const pts=poly.map(([X,Y])=>`${(X*S).toFixed(1)},${(Y*S).toFixed(1)}`).join(' ');
    const isbad=bad.has(p.uid), issel=sel&&sel.uid===p.uid;
    const stroke=isbad?'#e23b3b':(issel?'#1b4fa8':'#33414f');
    const sw=issel?2.2:(isbad?2:1);
    const b=bbox(poly);const cx=(b.x0+b.x1)/2*S,cy=(b.y0+b.y1)/2*S;
    h+=`<g class="pc" data-uid="${p.uid}" style="cursor:grab">`;
    h+=`<polygon points="${pts}" fill="${p.color}" fill-opacity="${isbad?0.5:0.82}" stroke="${stroke}" stroke-width="${sw}"/>`;
    if(b.w*S>34&&b.h*S>16)h+=`<text x="${cx}" y="${cy}" font-size="9.5" fill="#12202c" text-anchor="middle" dominant-baseline="middle" style="pointer-events:none">${p.id}</text>`;
    h+=`</g>`;
  }
  svg.innerHTML=h;
  bindPieceDrag();
  drawChips();
  drawPlatebar();
  // status
  const placed=PIECES.filter(p=>!p.inTray&&p.pi>=0).length;
  document.getElementById('stCount').textContent=`${placed}/${PIECES.length}`;
  // utilization + weight
  let usedA=0,plateA=0,wt=0;
  rects.forEach(r=>plateA+=r.L*r.W);
  for(const p of PIECES){if(p.inTray||p.pi<0)continue;const a=area(p.base);usedA+=a;wt+=a*p.t*DENS;}
  document.getElementById('stUtil').textContent=plateA?((usedA/plateA*100).toFixed(1)+'%'):'-';
  document.getElementById('stWt').textContent=wt?(wt>=1000?(wt/1000).toFixed(2)+' t':wt.toFixed(0)+' kg'):'-';
  const nbad=bad.size;
  document.getElementById('stWarn').textContent=nbad?`⚠ 충돌/범위초과/두께·재질불일치 ${nbad}개`:'';
  document.getElementById('stMsg').textContent=`여유 ${gapMM}mm`;
  // sel panel
  const sp=document.getElementById('selpanel');
  if(sel&&!sel.inTray){sp.classList.add('on');document.getElementById('selName').textContent=sel.name+' ('+sel.id+')';
    document.getElementById('selSpec').textContent=`t${sel.t} · ${sel.mat} · 회전 ${sel.rot}°`;}
  else sp.classList.remove('on');
}

/* ---------- chips (tray) ---------- */
function chipThumb(p){
  const loc=rotNorm(p.base,0);const b=bbox(loc);const s=30/Math.max(b.w,b.h,1);
  const pts=loc.map(([x,y])=>`${(2+x*s).toFixed(1)},${(2+(b.h-y)*s).toFixed(1)}`).join(' ');
  return `<svg class="sw" viewBox="0 0 34 34"><polygon points="${pts}" fill="${p.color}" fill-opacity="0.82" stroke="#33414f" stroke-width="0.8"/></svg>`;
}
function drawChips(){
  const c=document.getElementById('chips');let h='';
  for(const p of PIECES){
    const placed=!p.inTray&&p.pi>=0;
    const bd=p.conf?`<span class="badge b${p.conf}">${p.conf}</span>`:'';
    const tip=p.src?` title="${(p.src+(p.note?' | '+p.note:'')).replace(/"/g,'&quot;')}"`:'';
    h+=`<div class="chip ${placed?'placed':''}" data-uid="${p.uid}"${tip}>${chipThumb(p)}<div class="info"><div class="nm">${p.id} · ${p.name}${bd}</div><div class="sub">t${p.t} · ${p.mat}${placed?' · 판재'+(p.pi+1):''}</div></div></div>`;
  }
  c.innerHTML=h;
  c.querySelectorAll('.chip').forEach(el=>el.onclick=()=>chipClick(el.dataset.uid));
  document.getElementById('trayCount').textContent=PIECES.filter(p=>p.inTray).length+' 대기';
}
function chipClick(uid){
  const p=PIECES.find(x=>x.uid===uid);if(!p)return;
  if(!p.inTray){sel=p;render();return;}
  // place on first plate that fits (matching thickness preferred)
  const rects=plateRects();
  let order=rects.map((r,i)=>i).sort((a,b2)=>plateScore(rects[a],p)-plateScore(rects[b2],p));
  for(const pi of order){ if(tryPlace(p,pi,rects)){sel=p;render();return;} }
  if(rects.length===0){document.getElementById('stMsg').textContent='판재를 먼저 추가하세요';}
  else {document.getElementById('stMsg').textContent='빈 공간이 없습니다 — 판재추가 또는 자동네스팅';}
  render();
}

/* plate suitability: 0 = 두께+재질 일치, 1 = 두께만 일치, 2 = 불일치 */
function plateScore(r,p){const tOk=!r.ref.t||Math.abs(r.ref.t-p.t)<0.01; const mOk=!r.ref.mat||r.ref.mat===p.mat; return tOk&&mOk?0:(tOk?1:2);}
/* ---------- BLF placement core ---------- */
function tryPlace(p,pi,rects,rotCands){
  const r=rects[pi];if(!r)return false;
  rotCands=rotCands||[0,90,p.rot];
  const others=PIECES.filter(q=>q!==p&&!q.inTray&&q.pi===pi).map(q=>pieceWorldPoly(q,rects));
  const obb=others.map(o=>bbox(o));
  for(const rot of rotCands){
    const loc=rotNorm(p.base,rot);const b=bbox(loc);
    if(b.w>r.L+0.5||b.h>r.W+0.5)continue;
    const step=Math.max(10,Math.min(gapMM,25),Math.min(r.L,r.W)/160);
    for(let yy=0;yy+b.h<=r.W+0.5;yy+=step){
      for(let xx=0;xx+b.w<=r.L+0.5;xx+=step){
        const cand=translate(loc,r.x+xx,r.y+yy);
        let ok=true;
        const cb=bbox(cand);
        for(let k=0;k<others.length;k++){const ob=obb[k];if(cb.x0>ob.x1+gapMM||cb.x1<ob.x0-gapMM||cb.y0>ob.y1+gapMM||cb.y1<ob.y0-gapMM)continue;if(polyMinGap(cand,others[k])<gapMM-0.5){ok=false;break;}}
        if(ok){p.inTray=false;p.pi=pi;p.rot=rot;p.x=xx;p.y=yy;return true;}
      }
    }
  }
  return false;
}

/* ---------- auto arrange: all pieces onto existing plates (group by t+mat) ---------- */
function autoArrange(){
  if(!plates.length){document.getElementById('stMsg').textContent='판재가 없습니다';return;}
  // reset placement
  for(const p of PIECES){p.inTray=true;p.pi=-1;p.x=0;p.y=0;}
  const rects=plateRects();
  const items=[...PIECES].sort((a,b)=>area(b.base)-area(a.base));
  for(const p of items){
    // plate order: matching thickness first, then any
    const order=rects.map((r,i)=>i).sort((a,b2)=>plateScore(rects[a],p)-plateScore(rects[b2],p));
    let done=false;
    for(const pi of order){if(plateScore(rects[pi],p)>0)break; if(tryPlace(p,pi,rects,[0,90])){done=true;break;}}
    if(!done)for(const pi of order){if(tryPlace(p,pi,rects,[0,90]))break;}
  }
  sel=null;render();
}

/* ---------- auto fill leftover: only tray pieces into existing plates ---------- */
function autoFill(){
  const rects=plateRects();
  const items=PIECES.filter(p=>p.inTray).sort((a,b)=>area(b.base)-area(a.base));
  let n=0;
  for(const p of items){
    const order=rects.map((r,i)=>i).sort((a,b2)=>plateScore(rects[a],p)-plateScore(rects[b2],p));
    for(const pi of order){if(tryPlace(p,pi,rects,[0,90])){n++;break;}}
  }
  document.getElementById('stMsg').textContent=`자투리 ${n}개 배치됨`;
  render();
}

/* ---------- auto nest to custom plates (grouped by t+mat), bounded by transport max ---------- */
function autoNest(){
  const maxL=+document.getElementById('maxL').value||12000;
  const maxW=+document.getElementById('maxW').value||3000;
  // reset
  for(const p of PIECES){p.inTray=true;p.pi=-1;p.x=0;p.y=0;}
  // group by t+mat
  const groups={};
  for(const p of PIECES){const k=p.t+'|'+p.mat;(groups[k]=groups[k]||[]).push(p);}
  const newPlates=[];
  for(const k in groups){
    const [t,mat]=k.split('|');const list=groups[k].sort((a,b)=>Math.max(bbox(rotNorm(b.base,0)).h)-Math.max(bbox(rotNorm(a.base,0)).h));
    // shelf packing into plates of size maxL x maxW
    let plateIdx=newPlates.length;
    let shelfY=0,shelfX=0,shelfH=0;
    function newPlate(){newPlates.push({L:maxL,W:maxW,t:+t,mat});plateIdx=newPlates.length-1;shelfY=0;shelfX=0;shelfH=0;}
    newPlate();
    for(const p of list){
      // choose orientation: smaller height to fit shelf, within maxW
      let best=null;
      for(const rot of [0,90]){const b=bbox(rotNorm(p.base,rot));if(b.w<=maxL&&b.h<=maxW){if(!best||b.h<best.h)best={rot,w:b.w,h:b.h};}}
      if(!best){p.inTray=true;continue;}
      let w=best.w+gapMM,hh=best.h+gapMM;
      if(shelfX+w>maxL){shelfY+=shelfH;shelfX=0;shelfH=0;}
      if(shelfY+hh>maxW){newPlate();}
      p.rot=best.rot;p.pi=plateIdx; // provisional; corrected after plates committed
      p._px=shelfX;p._py=shelfY;
      shelfX+=w;shelfH=Math.max(shelfH,hh);
      p._plateLocal=plateIdx;
    }
  }
  // commit new plates (replace current with nested set)
  plates=newPlates;
  const rects=plateRects();
  for(const p of PIECES){
    if(p._plateLocal==null){p.inTray=true;p.pi=-1;continue;}
    p.inTray=false;p.pi=p._plateLocal;p.x=p._px;p.y=p._py;delete p._plateLocal;delete p._px;delete p._py;
  }
  // tighten by BLF re-pack per plate for correctness (avoids shelf gaps/overlap)
  const assign={};PIECES.forEach(p=>{if(!p.inTray)(assign[p.pi]=assign[p.pi]||[]).push(p);});
  for(const p of PIECES){if(!p.inTray){p.inTray=true;p._want=p.pi;p.pi=-1;}}
  for(const pi in assign){
    const list=assign[pi].sort((a,b)=>area(b.base)-area(a.base));
    for(const p of list){if(!tryPlace(p,+pi,plateRects(),[p.rot,0,90])){/* overflow -> try others */ for(let k=0;k<plates.length;k++){if(tryPlace(p,k,plateRects(),[0,90]))break;}}}
  }
  sel=null;
  document.getElementById('stMsg').textContent=`자동네스팅: 주문판재 ${plates.length}장 생성 (max ${maxL}×${maxW})`;
  render();
}

/* ---------- drag ---------- */
function clientToWorld(evt){
  const pt=svg.createSVGPoint();pt.x=evt.clientX;pt.y=evt.clientY;
  const m=svg.getScreenCTM().inverse();const q=pt.matrixTransform(m);
  const S=BASE_PXPMM*zoom;return{x:q.x/S,y:q.y/S};
}
let drag=null;
function bindPieceDrag(){
  svg.querySelectorAll('.pc').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      const p=PIECES.find(x=>x.uid===g.dataset.uid);if(!p)return;
      sel=p;const rects=plateRects();const r=rects[p.pi];
      const w=clientToWorld(e);
      drag={p,offx:w.x-(r.x+p.x),offy:w.y-(r.y+p.y)};
      g.setPointerCapture(e.pointerId);g.style.cursor='grabbing';
      render();
    });
    g.addEventListener('pointermove',e=>{
      if(!drag)return;const w=clientToWorld(e);const rects=plateRects();
      // which plate is cursor over?
      let pi=drag.p.pi;
      for(let i=0;i<rects.length;i++){const r=rects[i];if(w.x>=r.x-50&&w.x<=r.x+r.L+50&&w.y>=r.y-50&&w.y<=r.y+r.W+50){pi=i;break;}}
      const r=rects[pi];drag.p.pi=pi;drag.p.inTray=false;
      let nx=w.x-drag.offx, ny=w.y-drag.offy;
      const b=bbox(rotNorm(drag.p.base,drag.p.rot));
      nx=Math.max(0,Math.min(nx,r.L-b.w));ny=Math.max(0,Math.min(ny,r.W-b.h));
      drag.p.x=nx;drag.p.y=ny;render();
    });
    g.addEventListener('pointerup',e=>{if(drag){g.style.cursor='grab';drag=null;render();}});
  });
}

/* ---------- plate bar ---------- */
function drawPlatebar(){
  const pb=document.getElementById('platebar');let h='';
  if(!plates.length)h='<span class="hint">판재가 없습니다 — 우측 상단에서 판재를 추가하세요</span>';
  plates.forEach((p,i)=>{h+=`<span class="pbadge">판재 ${i+1} · ${p.L}×${p.W} · t${p.t} · ${p.mat}<button class="x" data-i="${i}" title="삭제">×</button></span>`;});
  pb.innerHTML=h;
  pb.querySelectorAll('.x').forEach(b=>b.onclick=()=>delPlate(+b.dataset.i));
}
function addPlate(){
  const L=+document.getElementById('npL').value,W=+document.getElementById('npW').value,t=+document.getElementById('npT').value,mat=document.getElementById('npMat').value.trim();
  if(!L||!W){return;}
  plates.push({L,W,t,mat});render();
}
function delPlate(i){
  // move its pieces to tray; reindex
  for(const p of PIECES){if(p.pi===i){p.inTray=true;p.pi=-1;p.x=0;p.y=0;}else if(p.pi>i)p.pi--;}
  plates.splice(i,1);render();
}

/* ---------- sel actions ---------- */
function rotSel(d){if(!sel||sel.inTray)return;sel.rot=(sel.rot+d+360)%360;
  // keep inside plate
  const rects=plateRects();const r=rects[sel.pi];const b=bbox(rotNorm(sel.base,sel.rot));
  sel.x=Math.max(0,Math.min(sel.x,r.L-b.w));sel.y=Math.max(0,Math.min(sel.y,r.W-b.h));render();}
function retSel(){if(!sel)return;sel.inTray=true;sel.pi=-1;sel.x=0;sel.y=0;sel.rot=0;render();}

/* ---------- wire up ---------- */
function setGapFromMethod(){document.getElementById('gap').value=document.getElementById('method').value;gapMM=+document.getElementById('gap').value;render();}
document.getElementById('method').onchange=setGapFromMethod;
document.getElementById('gap').oninput=()=>{gapMM=+document.getElementById('gap').value||0;render();};
document.getElementById('addPlate').onclick=addPlate;
document.getElementById('autoArr').onclick=autoArrange;
document.getElementById('autoFill').onclick=autoFill;
document.getElementById('autoNest').onclick=autoNest;
document.getElementById('reset').onclick=()=>{for(const p of PIECES){p.inTray=true;p.pi=-1;p.x=0;p.y=0;p.rot=0;}sel=null;render();};
document.getElementById('zoom').oninput=e=>{zoom=+e.target.value;render();};
document.getElementById('rot15').onclick=()=>rotSel(15);
document.getElementById('rot90').onclick=()=>rotSel(90);
document.getElementById('ret').onclick=retSel;
window.addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){rotSel(e.shiftKey?90:15);}if(e.key==='Delete'||e.key==='Backspace'){retSel();}});
window.addEventListener('resize',()=>render());

// project selector
const psel=document.getElementById('projSel');
{const grp={};Object.keys(PROJECTS).forEach(k=>{const base=k==='SUMMARY'?'분석':k.replace(/-(AI|CMP)$/,'');(grp[base]=grp[base]||[]).push(k);});
 psel.innerHTML=Object.keys(grp).map(g=>`<optgroup label="${g}">`+grp[g].map(k=>`<option value="${k}">${PROJECTS[k].label.replace(g+' · ','')}</option>`).join('')+`</optgroup>`).join('');}
psel.onchange=()=>loadProject(psel.value);

gapMM=+document.getElementById('gap').value;
loadProject(Object.keys(PROJECTS)[0]);

</script>
</body>
</html>
